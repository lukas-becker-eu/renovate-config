name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release-as:
        description: "Force version (e.g. 1.0.0) — leave empty to auto-detect"
        required: false

jobs:
  release-please:
    name: Release Please
    runs-on: [self-hosted, lukasbecker-ci]
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          release-as: ${{ github.event.inputs.release-as }}
